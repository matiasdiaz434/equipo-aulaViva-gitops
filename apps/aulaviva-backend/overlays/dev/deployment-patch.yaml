apiVersion: apps/v1
kind: Deployment
metadata:
  name: aulaviva-backend
spec:
  selector:
    matchLabels:
      app: aulaviva-backend
  template:
    metadata:
      labels:
        app: aulaviva-backend
    containers:
        - name: backend
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi